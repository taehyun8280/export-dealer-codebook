<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수출 거래처 코드북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: search bar on top, filterable ledger on the left, a shipping-label style detail card pinned on the right; tabs for 지역별 / 일괄 조회 */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunken:#F5F8F9; --ink:#14212B; --muted:#5A6873; --faint:#8995A0; --line:#D8E0E5;
  --accent:#0D6680; --accent-soft:#DCEDF2; --warn:#9A5B0B; --warn-soft:#FBEFD9;
  --b-fursys:#2C5BA6; --b-fursys-soft:#E1E9F6; --b-sidiz:#B0502A; --b-sidiz-soft:#F7E5DD; --b-iloom:#357F53; --b-iloom-soft:#DFF0E5;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --surface:#162229; --sunken:#1B2932; --ink:#E5ECF0; --muted:#9BABB6; --faint:#6E7F8A; --line:#2A3A44;
  --accent:#4FB4D2; --accent-soft:#163846; --warn:#E7B05C; --warn-soft:#3A2C14;
  --b-fursys:#7FA6E6; --b-fursys-soft:#1D2D48; --b-sidiz:#E9946E; --b-sidiz-soft:#43271C; --b-iloom:#7CC897; --b-iloom-soft:#1C3726;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#162229; --sunken:#1B2932; --ink:#E5ECF0; --muted:#9BABB6; --faint:#6E7F8A; --line:#2A3A44;
  --accent:#4FB4D2; --accent-soft:#163846; --warn:#E7B05C; --warn-soft:#3A2C14;
  --b-fursys:#7FA6E6; --b-fursys-soft:#1D2D48; --b-sidiz:#E9946E; --b-sidiz-soft:#43271C; --b-iloom:#7CC897; --b-iloom-soft:#1C3726;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.stats b{font-family:var(--font-mono);font-size:17px;color:var(--ink);font-weight:600;margin-right:3px;font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}

.search{position:relative;margin-bottom:12px}
.search input{width:100%;font:500 18px var(--font-body);padding:15px 52px 15px 48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search input::placeholder{color:var(--faint);font-weight:400;font-size:15px}
.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 11px var(--font-mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--sunken);color:var(--muted);border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}

.filters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:16px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 11px;font:500 12.5px var(--font-body);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:focus-visible,.tab:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);font:600 14px var(--font-body);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}.detail{position:static!important;order:-1}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunken)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
.code{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums}
.code .pre{color:var(--faint);font-weight:500}
.none{color:var(--faint);font-style:normal}
.missing{color:var(--warn);background:var(--warn-soft);padding:1px 7px;border-radius:4px;font-size:12px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px}
.b-퍼시스{color:var(--b-fursys);background:var(--b-fursys-soft)}
.b-시디즈{color:var(--b-sidiz);background:var(--b-sidiz-soft)}
.b-일룸{color:var(--b-iloom);background:var(--b-iloom-soft)}
.mgr{color:var(--muted);font-size:12.5px}
.mgr .arrow{color:var(--faint);margin:0 4px}
.resultbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);gap:8px;flex-wrap:wrap}
mark{background:none;color:var(--accent);font-weight:700}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}

/* Detail card styled like a shipping label */
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);overflow:hidden}
.label-head{padding:16px 18px 14px;border-bottom:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.label-k{font-size:10.5px;letter-spacing:.09em;color:var(--faint);font-weight:600}
.bigcode{font:600 30px/1.15 var(--font-mono);letter-spacing:.01em;margin-top:2px;word-break:break-all}
.bigcode .pre{color:var(--faint);font-weight:500}
.country-row{padding:16px 18px;background:var(--sunken);border-bottom:1px solid var(--line)}
.country{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.country.na{font-size:16px;font-weight:600;color:var(--warn)}
.country-sub{color:var(--muted);font-size:13px;margin-top:2px}
dl{margin:0;padding:6px 18px 14px;display:grid;grid-template-columns:auto 1fr;gap:0 14px}
dt{font-size:12px;color:var(--faint);padding:9px 0;border-bottom:1px solid var(--line)}
dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
dl > :nth-last-child(-n+2){border-bottom:0}
.note{margin:0 18px 16px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;line-height:1.5}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note a,.linkbtn{color:inherit;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font:inherit;font-weight:600}
.copy{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:5px 10px;font:500 12px var(--font-body);cursor:pointer;white-space:nowrap}
.copy:hover{color:var(--ink);border-color:var(--accent)}
.detail-empty{padding:32px 20px;color:var(--muted);text-align:center;font-size:13.5px}

/* Region view */
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.region{padding:14px 16px}
.region h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.region h3 span{font:500 12px var(--font-mono);color:var(--faint)}
.crow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.crow:first-of-type{border-top:0}
.cname{font-weight:600;font-size:13px;padding-top:2px}
.cname.na{color:var(--warn);font-weight:500;font-size:12px}
.codes{display:flex;flex-wrap:wrap;gap:5px}
.cc{font:600 12px var(--font-mono);border:1px solid var(--line);background:var(--sunken);color:var(--ink);border-radius:5px;padding:2px 7px;cursor:pointer}
.cc:hover{border-color:var(--accent);color:var(--accent)}
.cc.b16{border-left:3px solid var(--b-sidiz)}.cc.b17{border-left:3px solid var(--b-iloom)}.cc.b12{border-left:3px solid var(--b-fursys)}

/* Bulk */
.bulk{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.bulk{grid-template-columns:1fr}}
.bulk textarea{width:100%;min-height:260px;font:500 14px/1.6 var(--font-mono);padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical;outline:none}
.bulk textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.help{font-size:12.5px;color:var(--muted);margin:8px 0 0}
tr.nf td{color:var(--warn)}

.foot{margin-top:28px;font-size:12.5px;color:var(--muted);line-height:1.7}
.foot h4{font-size:12px;letter-spacing:.06em;color:var(--faint);margin:0 0 6px}
.foot ul{margin:0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.wrap{padding:20px 16px 48px}.search .kbd{display:none}.hide-sm{display:none}.bigcode{font-size:26px}.crow{grid-template-columns:80px 1fr}}
[hidden]{display:none!important}
/* Inline 딜러담당자 input */
td.mgr-cell{padding:4px 8px}
.mgr-in{width:100%;min-width:110px;font:500 13.5px var(--font-body);padding:5px 8px;border:1px dashed var(--line);border-radius:6px;background:transparent;color:var(--ink);outline:none}
.mgr-in::placeholder{color:var(--faint)}
.mgr-in:hover{border-style:solid;border-color:var(--accent)}
.mgr-in:focus{border-style:solid;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.mgr-in.pending{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
dd .mgr-in{text-align:right}
/* Edit mode */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font:600 12.5px var(--font-body);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.editbar{background:var(--accent-soft);color:var(--accent);font-weight:600}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--warn)}
td.ed{padding:4px 6px}
td.ed input{width:100%;min-width:84px;font:500 13.5px var(--font-body);padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);outline:none}
td.ed input.code-in{font-family:var(--font-mono);font-weight:600;min-width:96px}
td.ed input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
td.ed input.changed{background:var(--accent-soft);border-color:var(--accent)}
td.ed input.dup{border-color:var(--warn);background:var(--warn-soft)}
tr.removed td{opacity:.45}
tr.removed td.ed input{text-decoration:line-through}
tr.added td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rm{border:0;background:none;color:var(--faint);cursor:pointer;font:600 12px var(--font-body);padding:4px 6px;border-radius:5px;white-space:nowrap}
.rm:hover{color:var(--warn);background:var(--warn-soft)}
tr.removed .rm{color:var(--accent)}

/* ===== Visual refresh: navy header band, crisp contrast, color-coded regions ===== */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --sunken:#F4F7FB; --ink:#0D1B2E; --muted:#4F5D70; --faint:#8A97A8; --line:#DCE3EC;
  --accent:#1767D2; --accent-soft:#E3EEFC; --warn:#B4600B; --warn-soft:#FDF0DE;
  --hero:#0E2342; --hero-2:#163763; --hero-ink:#F3F7FD; --hero-muted:#A9BBD6;
  --shadow:0 1px 2px rgba(13,27,46,.06),0 6px 18px rgba(13,27,46,.06);
  --rg0:#2F7BE0; --rg1:#D97B12; --rg2:#4C9A2A; --rg3:#0F9D9A; --rg4:#7A5AE0; --rg5:#D9434F; --rg6:#C0399A; --rgx:#7D8796;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B131D; --surface:#121D2A; --sunken:#172433; --ink:#E8EEF6; --muted:#A3B1C2; --faint:#6F7F92; --line:#24354A;
  --accent:#5EA2F5; --accent-soft:#16304F; --warn:#F0B260; --warn-soft:#3A2A14;
  --hero:#0F2440; --hero-2:#1A3A66; --hero-ink:#F3F7FD; --hero-muted:#9FB3D1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --rg0:#6AA6F2; --rg1:#F0A24A; --rg2:#7DC25A; --rg3:#3CC7C3; --rg4:#A58CF2; --rg5:#F07780; --rg6:#E472C3; --rgx:#97A2B1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B131D; --surface:#121D2A; --sunken:#172433; --ink:#E8EEF6; --muted:#A3B1C2; --faint:#6F7F92; --line:#24354A;
  --accent:#5EA2F5; --accent-soft:#16304F; --warn:#F0B260; --warn-soft:#3A2A14;
  --hero:#0F2440; --hero-2:#1A3A66; --hero-ink:#F3F7FD; --hero-muted:#9FB3D1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --rg0:#6AA6F2; --rg1:#F0A24A; --rg2:#7DC25A; --rg3:#3CC7C3; --rg4:#A58CF2; --rg5:#F07780; --rg6:#E472C3; --rgx:#97A2B1;
  color-scheme:dark}
body{background:var(--bg)}
.wrap{padding-top:22px}

/* Header band */
header.top{background:var(--hero);background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0),linear-gradient(120deg,var(--hero) 0%,var(--hero-2) 100%);background-size:18px 18px,100% 100%;
  color:var(--hero-ink);border-radius:16px;padding:26px 28px 58px;margin-bottom:0;align-items:center}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--hero-ink)}
.eyebrow{font:600 11px var(--font-mono);letter-spacing:.14em;color:var(--hero-muted);margin-bottom:6px}
.stats{gap:10px}
.stats > span{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 14px;color:var(--hero-muted);font-size:11.5px;min-width:92px}
.stats b{font-size:22px;color:var(--hero-ink);margin:0;line-height:1.1}
.stats b small{font:600 14px var(--font-body);margin-left:3px;color:var(--hero-ink)}

/* Search floats over the band */
.search{margin:-30px 18px 18px;z-index:1}
.search input{border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(13,27,46,.16);font-size:17px;padding-block:16px}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),0 10px 30px rgba(13,27,46,.16)}

/* Region filter chips with color dots */
.filters{margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:5px 12px;box-shadow:0 1px 1px rgba(13,27,46,.04)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint))}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.chip[aria-pressed="true"] .dot{background:#fff}

/* Tabs as a segmented control */
.tabs{border-bottom:0;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;display:inline-flex;margin-bottom:16px;max-width:100%}
.tab{border-bottom:0;margin:0;border-radius:8px;padding:8px 16px;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--hero);color:var(--hero-ink)}

/* Panels and table */
.panel{border-color:var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel > .tablewrap{border-radius:0 0 14px 14px}
.resultbar{padding:12px 16px;font-size:13px}
#count{font-weight:700;color:var(--ink)}
th{background:var(--sunken);color:var(--muted);font-size:11.5px;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;font-size:14px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--sunken) 55%,var(--surface))}
tbody tr:hover td{background:var(--accent-soft)}
tbody tr.sel td{background:var(--accent-soft)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.code{color:var(--c,var(--accent));font-size:14px;letter-spacing:.01em}
td.country-cell{font-weight:600}
.rpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.rpill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.mgr-in{border:1px solid transparent;background:transparent}
.mgr-in:hover{border-color:var(--line)}

/* Detail card */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px;min-width:0;max-height:calc(100vh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side > .panel{display:flex;flex-direction:column;min-height:0}
.side > .panel.mgr-panel{flex:1 1 auto}
.side > .panel.reg-panel{flex:none}
.side .mgr-panel .sp-list{overflow-y:auto;min-height:0;flex:1 1 auto}
@media (max-width:880px){.side{position:static;max-height:none}}
.sp-head{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.sp-title{font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sp-title small{font:500 12px var(--font-body);color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.sp-list{list-style:none;margin:0;padding:4px 6px 8px}
.sp-item{width:100%;display:grid;grid-template-columns:88px minmax(0,1fr) 30px;gap:10px;align-items:center;padding:6px 10px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sp-item:hover{background:var(--sunken)}
.sp-item[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.sp-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-name .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

  ROWS=ROWS.map((r,i)=>({r,i})).sort((x,y)=>regionRank(x.r.region||'미분류')-regionRank(y.r.region||'미분류')
    || firstSeen[x.r.region+'|'+x.r.country]-firstSeen[y.r.region+'|'+y.r.country] || x.i-y.i).map(x=>x.r);
}

function hl(text,q){
  const t=esc(text); if(!q) return t;
  const i=String(text).toUpperCase().indexOf(q.toUpperCase());
  if(i<0) return t;
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function mgrHTML(r,q){ return r.mgr?`<span class="who">${avatar(r.mgr)}${hl(r.mgr,q||'')}</span>`:''; }
const ISO={'일본':'JP','중국':'CN','베트남':'VN','인도':'IN','인도네시아':'ID','싱가폴':'SG','싱가포르':'SG','필리핀':'PH','자카르타':'ID','파키스탄':'PK','대만':'TW','말레이시아':'MY','태국':'TH','스리랑카':'LK','카자흐스탄':'KZ','홍콩/필리핀':'HK','홍콩':'HK','카타르':'QA','사우디':'SA','UAE':'AE','오만':'OM','케냐':'KE','호주':'AU','러시아':'RU','미국':'US','멕시코':'MX','칠레':'CL','콜롬비아':'CO','코스타리카':'CR','과테말라':'GT','온두라스':'HN','퀴라소':'CW','자메이카':'JM','페루':'PE','파나마':'PA','베네수엘라':'VE','도미니카 공화국':'DO','에콰도르':'EC','캐나다':'CA','영국':'GB','독일':'DE','프랑스':'FR'};
function countryHTML(r){ if(!r.country) return '<span class="missing">미기재</span>'; const c=ISO[r.country]; return (c?`<span class="iso">${c}</span>`:'')+esc(r.country); }
function avatar(name){ const n=String(name||'').trim(); if(!n) return ''; let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))>>>0; return `<span class="av" style="--c:var(--rg${h%7})" aria-hidden="true">${esc(n[0])}</span>`; }

function score(r,q){
  if(!q) return 1;
  const nq=norm(q), code=norm(r.code), dealer=norm(r.dealer), core=code.replace(/^12/,'');
  if(code && code===nq) return 100;
  if(core && core===nq) return 95;
  if(dealer===nq) return 90;
  if(code.startsWith(nq)||core.startsWith(nq)) return 70;
  if(dealer.startsWith(nq)) return 60;
  if(code.includes(nq)||dealer.includes(nq)) return 40;
  const lq=q.trim();
  if([r.country,r.region,r.mgr].some(v=>v&&v.includes(lq))) return 30;
  return 0;
}
// In edit mode, rows shown are the draft values (plus added rows on top)
function workingRows(){
  if(!state.editing) return ROWS;
  const added=draft.added.map(k=>draft.byKey[k]);
  return [...added,...ROWS.map(r=>draft.byKey[r.k]||r)];
}
function filtered(){
  const q=state.q.trim();
  const rows=workingRows();
  return rows.map((r,i)=>({r,i,s:score(r,q)}))
    .filter(x=>(x.s>0||(state.editing&&draft.added.includes(x.r.k))) && (state.region==='전체'||(x.r.region||'미분류')===state.region||(state.editing&&draft.added.includes(x.r.k))) && (state.mgr===null||(state.mgr===''?!x.r.mgr.trim():x.r.mgr.trim()===state.mgr)))
    .sort((a,b)=>b.s-a.s || a.i-b.i)
    .map(x=>x.r);
}

function dupCodes(){
  const c={}; workingRows().forEach(r=>{if(state.editing&&draft.removed.has(r.k))return;const n=norm(r.code);if(n)c[n]=(c[n]||0)+1;});

function rowView(r,q){

}
function rowEdit(r,dups){
  const orig=ROWS.find(x=>x.k===r.k);
  const removed=draft.removed.has(r.k), added=draft.added.includes(r.k);
  const list={country:'dlCountry',region:'dlRegion',mgr:'dlMgr'};
  const cells=FIELDS.map(f=>{
    const changed=!added&&orig&&orig[f]!==r[f];
    const dup=f==='code'&&r.code&&dups[norm(r.code)]>1;
    return `<td class="ed"><input id="e-${r.k}-${f}" data-k="${r.k}" data-f="${f}" value="${esc(r[f])}" aria-label="${LABEL[f]}" ${list[f]?`list="${list[f]}"`:''} class="${f==='code'?'code-in ':''}${changed?'changed ':''}${dup?'dup':''}" ${removed?'disabled':''} ${f==='code'?'spellcheck="false"':''} ></td>`;
  }).join('');
  return `<tr data-k="${r.k}" class="${removed?'removed':''} ${added?'added':''} ${r.k===state.sel?'sel':''}">${cells}<td class="ed"><button class="rm" data-rm="${r.k}">${removed?'되돌리기':'삭제'}</button></td></tr>`;
}

function render(){
  const list=filtered();
  const q=state.q.trim();
  $('#count').textContent=q||state.region!=='전체'||state.mgr!==null?`${list.length}건 일치`:`전체 ${list.length}건`;
  $('#empty').hidden=list.length>0;
  $('#headRow').innerHTML=FIELDS.map(f=>`<th>${LABEL[f]}</th>`).join('')+(state.editing?'<th></th>':'');
  if(state.editing){
    const dups=dupCodes();
    $('#rows').innerHTML=list.map(r=>rowEdit(r,dups)).join('');
  }else{
    if(q && list.length && score(list[0],q)>=90) state.sel=list[0].k;
    else if(state.sel!==null && !list.some(r=>r.k===state.sel)) state.sel=list.length?list[0].k:null;
    if(state.sel===null && list.length) state.sel=list[0].k;
    let html='', prev=null;
    const grouped=!q;
    const counts={}; if(grouped) list.forEach(r=>{const k=r.region||'미분류';counts[k]=counts[k]||{n:0,c:new Set(),m:0};counts[k].n++;if(r.country)counts[k].c.add(r.country);if(r.mgr)counts[k].m++;});
    list.forEach(r=>{
      const k=r.region||'미분류';
      if(grouped&&k!==prev){const g=counts[k];html+=`<tr class="grp" style="--c:${regionColor(k)}"><td colspan="5"><div class="grp-in">${esc(k)}<small>${g.n}</small><span class="grp-meta">${g.c.size}개 국가 · 담당자 ${g.m}/${g.n}</span></div></td></tr>`;prev=k;}

  }
  $('#listGrid').style.gridTemplateColumns=state.editing?'minmax(0,1fr)':'';
  $('#side').hidden=state.editing;

  if(state.editing) updateDirty(); else renderSide();
  if(state.tab==='region') renderRegions();
}
function fmtDate(iso){try{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}catch(e){return '';}}

function lookup(token){
  const n=norm(token);
  let m=ROWS.filter(r=>norm(r.code)===n);
  if(!m.length) m=ROWS.filter(r=>norm(r.code).replace(/^12/,'')===n || norm(r.dealer)===n);

/* ---------- editing ---------- */
function startEdit(focusKey,field){
  if(!state.canSave) return;
  if(pending.size){clearTimeout(qsTimer);quickSave();}
  draft={byKey:{},added:[],removed:new Set()};
  state.editing=true; setTab('list');
  if(focusKey){state.sel=focusKey;}
  render();
  if(focusKey){const i=document.getElementById(`e-${focusKey}-${field||'mgr'}`); if(i){i.scrollIntoView({block:'center'});i.focus();i.select();}}
}
function changes(){
  let n=0;
  Object.values(draft.byKey).forEach(r=>{
    if(draft.added.includes(r.k)){ if(!draft.removed.has(r.k)&&FIELDS.some(f=>r[f].trim())) n++; return; }
    const o=ROWS.find(x=>x.k===r.k); if(!draft.removed.has(r.k)&&o&&FIELDS.some(f=>o[f]!==r[f])) n++;
  });
  draft.removed.forEach(k=>{if(!draft.added.includes(k))n++;});
  return n;
}
function updateDirty(){
  const n=changes();
  $('#dirtyInfo').textContent=n?`편집 중 · 변경 ${n}건`:'편집 중 · 칸을 눌러 바로 고치세요';
  $('#saveBtn').disabled=n===0||saving;
}
function editRow(k){ if(!draft.byKey[k]){const o=ROWS.find(x=>x.k===k); draft.byKey[k]={...o};} return draft.byKey[k]; }
let saving=false;
async function save(){
  const n=changes(); if(!n||saving) return;
  const next=[];
  draft.added.slice().reverse().forEach(k=>{const r=draft.byKey[k]; if(!draft.removed.has(k)&&FIELDS.some(f=>r[f].trim())) next.push(r);});
  ROWS.forEach(o=>{ if(draft.removed.has(o.k)) return; next.push(draft.byKey[o.k]||o); });
  const clean=next.map(r=>{const o={k:r.k};FIELDS.forEach(f=>o[f]=String(r[f]||'').trim());if(r.star)o.star=true;return o;});
  const payload={rows:clean,updated:new Date().toISOString(),dropped:META.dropped};
  saving=true; $('#saveBtn').disabled=true; setStatus('저장 중…');
  try{
    const where=await persist(payload);
    loadData(payload); state.editing=false; draft=null; saving=false;
    renderStats(); renderFilters(); render(); renderNotes();
    showSaved(where); toast(`${n}건 저장됨`);
  }catch(e){
    saving=false; updateDirty();
    const c=e&&e.code;
    if(c==='conflict'){setStatus('다른 곳에서 먼저 저장해 최신 내용으로 다시 불러옵니다.',true);}
    else if(c==='rate_limited'){setStatus('저장이 너무 잦습니다. 잠시 후 다시 저장하세요.',true);}
    else setStatus('저장하지 못했습니다. 잠시 후 다시 시도하세요.',true);
  }
}

});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#q').addEventListener('input',e=>{state.q=e.target.value;syncClear();render();});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';state.q='';syncClear();render();}});
$('#clear').onclick=()=>{$('#q').value='';state.q='';syncClear();render();$('#q').focus();};
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'){e.preventDefault();$('#q').focus();}
  if(state.editing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}
});
$('#editBtn').onclick=()=>startEdit();
$('#addBtn').onclick=()=>{
  const k=newKey(); draft.byKey[k]={k,code:'',dealer:'',country:'',region:'',mgr:''}; draft.added.push(k);
  render(); const i=document.getElementById(`e-${k}-code`); i&&(i.scrollIntoView({block:'center'}),i.focus());
};
$('#saveBtn').onclick=save;
$('#cancelBtn').onclick=cancelEdit;
window.addEventListener('beforeunload',e=>{if(state.editing&&changes()){e.preventDefault();e.returnValue='';}});

function boot(){renderStats();renderFilters();render();renderNotes();}
boot();
try{const t=localStorage.getItem('codebook-tab');if(t==='region')setTab(t);}catch(e){}

// Saved edits live in data.json next to the page; the inline copy above is only the first paint.
// Editing is offered only where the page can save itself (the claude.ai artifact view, for people with edit access).
/* ---------- quick 딜러담당자 input: saves by itself a moment after typing stops ---------- */
function setQuick(msg,err){const s=$('#saveInfo');s.textContent=msg;s.classList.toggle('err',!!err);}
document.addEventListener('input',e=>{
  const i=e.target; if(!i.dataset||!i.dataset.mgr||state.editing) return;
  const r=ROWS.find(x=>x.k===i.dataset.mgr); if(!r) return;
  r.mgr=i.value; pending.add(r.k);
  document.querySelectorAll(`[data-mgr="${r.k}"]`).forEach(x=>{if(x!==i)x.value=i.value;x.classList.add('pending');});
  setQuick('입력 중…'); clearTimeout(qsTimer); qsTimer=setTimeout(quickSave,1500);
  renderSide();
});
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.mgr&&e.key==='Enter'){e.preventDefault();clearTimeout(qsTimer);quickSave();
  const ins=[...document.querySelectorAll('#rows .mgr-in')];const n=ins[ins.indexOf(e.target)+1];n&&n.focus();}});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.mgr&&pending.size){clearTimeout(qsTimer);qsTimer=setTimeout(quickSave,300);}});
async function quickSave(){
  if(!pending.size) return;
  if(qsBusy){clearTimeout(qsTimer);qsTimer=setTimeout(quickSave,800);return;}
  qsBusy=true; const keys=[...pending]; setQuick('저장 중…');
  const payload={rows:ROWS.map(r=>{const o={k:r.k};FIELDS.forEach(f=>o[f]=String(r[f]||'').trim());if(r.star)o.star=true;return o;}),updated:new Date().toISOString(),dropped:META.dropped};
  try{
    const where=await persist(payload);
    keys.forEach(k=>pending.delete(k)); META.updated=payload.updated;
    document.querySelectorAll('.mgr-in').forEach(x=>{if(!pending.has(x.dataset.mgr))x.classList.remove('pending');});
    showSaved(where); renderStats(); renderNotes();
  }catch(e){
    const c=e&&e.code;
    setQuick(c==='conflict'?'다른 곳에서 먼저 저장해 다시 불러옵니다':c==='rate_limited'?'저장이 잦아 잠시 후 다시 저장합니다':'저장하지 못했습니다. 다시 입력해 주세요',true);
    if(c==='rate_limited'){clearTimeout(qsTimer);qsTimer=setTimeout(quickSave,5000);}
  }finally{qsBusy=false;}
}
window.addEventListener('beforeunload',e=>{if(pending.size){e.preventDefault();e.returnValue='';}});

// Saving: publish data.json to the artifact when this view can (claude.ai, edit access).
// Every save is also kept in this browser, so typing is never lost where publishing is unavailable.
let lastWhere='';
async function persist(payload){
  const json=JSON.stringify(payload,null,1);
  let kept=false; try{localStorage.setItem('codebook-data',json);kept=true;}catch(e){}
  let art=null;
  try{ if(window.claude&&window.claude.use) art=await window.claude.use('artifact'); }catch(e){}
  if(art){
    try{ await art.publish({'data.json':{content:json,contentType:'application/json'}}); return 'shared'; }
    catch(e){ const c=e&&e.code; if(c==='conflict'||c==='rate_limited') throw e; return 'local'; }
  }
  if(!kept) throw {code:'no_storage'};
  return 'local';
}
function showSaved(where){
  lastWhere=where;
  setQuick(where==='shared'?`저장됨 · ${fmtDate(META.updated)}`:`이 브라우저에 저장됨 · ${fmtDate(META.updated)}`);
}
function localData(){try{const d=JSON.parse(localStorage.getItem('codebook-data')||'null');return d&&Array.isArray(d.rows)?d:null;}catch(e){return null;}}
const newer=(a,b)=>(!b||(a&&(a.updated||'')>(b.updated||'')))?a:b;
function withLocalMgr(d){
  const L=localData(); if(!L||L===d) return d;
  const m={}; L.rows.forEach(r=>{if(r.mgr)m[r.k]=r.mgr;});
  return {...d,rows:d.rows.map(r=>(!r.mgr&&m[r.k])?{...r,mgr:m[r.k]}:r)};
}
(()=>{const L=localData(); const pick=withLocalMgr(newer(L,SEED)); loadData(pick); boot();})();
fetch('data.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(state.editing||pending.size) return;
  const pick=withLocalMgr(newer(localData(),newer(d&&Array.isArray(d.rows)?d:null,SEED)));
  loadData(pick); boot();
}).catch(()=>{});

// Copy the whole table for Excel
$('#copyAll').onclick=()=>{
  const lines=[FIELDS.map(f=>LABEL[f]).join('\t'),...ROWS.map(r=>FIELDS.map(f=>r[f]).join('\t'))];
  copyText(lines.join('\n'),`${ROWS.length}행 복사됨 — 엑셀에 붙여넣으세요`);
};
